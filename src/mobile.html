<style>
:root{
  --bg:#1a1214;--bg2:#211719;--card:#261b1e;--card2:#30232700;--line:#3b2b30;--text:#f8eef0;--muted:#b8a3a8;--faint:#7f6a70;
  --accent:#ef3a3f;--gold:#ffc247;--cyan:#62e0e8;--green:#7ee2a8;--ink:#fff;
  --ease:cubic-bezier(.23,1,.32,1);--r:18px;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
  --display:"SF Pro Display",-apple-system,system-ui,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
a{color:var(--cyan)}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(90vw 50vh at 100% -10%,rgba(239,58,63,.18),transparent 70%),radial-gradient(80vw 40vh at -10% 110%,rgba(98,224,232,.08),transparent 70%)}
main{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px);overscroll-behavior-y:contain}
header.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 16px}
header.hd h1{margin:0;font:800 34px/1.05 var(--display);letter-spacing:-.02em}
header.hd p{margin:4px 0 0;color:var(--muted);font-size:15px}
.refresh{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;border:1px solid var(--line);transition:transform .16s var(--ease)}

.refresh svg{width:19px;height:19px}
.refresh.spin svg{animation:spin .8s linear infinite}

svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{padding:14px;border-radius:var(--r);background:linear-gradient(180deg,#2c2024,#231a1d);border:1px solid var(--line)}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{display:block;margin-top:2px;font:800 30px/1.05 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat b.hot{color:var(--accent)}
.card{margin:0 0 12px;padding:14px 16px;border-radius:var(--r);background:linear-gradient(180deg,#2a1e22,#22181b);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card h3{margin:0 0 8px;font:700 17px/1.2 var(--display);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font:500 13px var(--display);color:var(--muted)}
.hero{position:relative;overflow:hidden;padding:18px;border-radius:22px;margin-bottom:14px;background:radial-gradient(120% 140% at 0 0,rgba(239,58,63,.35),transparent 60%),#261b1e;border:1px solid rgba(239,58,63,.45)}
.hero small{color:var(--gold);font-weight:600;font-size:13px}
.hero h2{margin:4px 0 2px;font:800 24px/1.15 var(--display);letter-spacing:-.01em}

.list li .t span{display:block;overflow-wrap:anywhere}

.list li b{flex:none;font-weight:600;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.list li.hot b,.big.hot,b.hot{color:var(--accent)}

.list li.past .t span{color:var(--faint);text-decoration:line-through}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px;transition:transform .16s var(--ease),background-color .15s}

.field{width:100%;min-height:44px;padding:10px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);outline:none}
.field:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.row .field{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}

.check.on i{background:var(--accent);border-color:var(--accent)}
.check.on i::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.check.on span{color:var(--faint);text-decoration:line-through}
.check small{margin-left:auto;color:var(--muted)}
h4.sec{margin:16px 2px 6px;font:600 13px var(--display);color:var(--muted);letter-spacing:.02em}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--gold);transition:width .5s var(--ease)}
.bar i.hot{background:var(--accent)}
.big{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:2px 0}
.covers{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scroll-padding-inline:16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.covers::-webkit-scrollbar{display:none}
.covers button{flex:none;width:104px;scroll-snap-align:start;text-align:left}
.covers img,.covers .ph{width:104px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--card);display:block;box-shadow:0 10px 20px -12px #000}

.pcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcbtn{display:grid;justify-items:center;gap:4px;padding:14px 6px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600;transition:transform .16s var(--ease),background-color .15s}

.card.week .strip{margin:8px 0 4px;grid-template-columns:repeat(3,minmax(0,1fr))}.card.week .stat b{font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wk-h{margin:12px 0 4px;color:var(--muted);font-size:13px;font-weight:700}.stack{display:grid;gap:8px}

nav.tabs button:active{transform:scale(.92)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);z-index:9;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:rgba(48,35,39,.95);border:1px solid var(--line);font-size:14px;transition:opacity .2s var(--ease),transform .25s var(--ease)}
@starting-style{.toast{opacity:0;transform:translate(-50%,10px)}}
.skel{height:64px;border-radius:var(--r);margin-bottom:12px;background:linear-gradient(90deg,#241a1d 0,#2e2226 50%,#241a1d 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.view{animation:in .28s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.view,.skel,.refresh.spin svg{animation:none}}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:var(--muted)}}
</style>

<script>
'use strict';
const T = new URLSearchParams(location.search).get('t') || '__T__';

  genshin: '<path d="M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z"/>',
  mas: '<circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/>',

};
const TABS = [['hoy', 'Hoy'], ['casa', 'Casa'], ['juegos', 'Juegos'], ['genshin', 'Genshin'], ['mas', 'Más']];
const S = { tab: localStorage.getItem('vt-tab') || 'hoy', sub: JSON.parse(localStorage.getItem('vt-sub') || '{}'), data: {}, at: {}, busy: false, chat: JSON.parse(sessionStorage.getItem('vt-chat') || '{"msgs":[],"session":null}') };
const api = async (p, opt) => {

  return r.json();
};
const DAY = 86400000;
const hm = (t) => new Date(t).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
const dd = (t) => new Date(t).toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' });
const when = (d) => d == null ? 'sin fecha' : d === 0 ? 'hoy' : d === 1 ? 'mañana' : d < 0 ? 'atrasado' : 'en ' + d + ' días';

const until = (t) => { const m = Math.round((t - Date.now()) / 60000); if (m <= 0) return 'ahora'; if (m < 60) return 'en ' + m + ' min'; const hh = Math.floor(m / 60); return hh < 48 ? 'en ' + hh + ' h' : 'en ' + Math.round(hh / 24) + ' días'; };

const li = (main, side, cls, sub) => h('li', { class: cls || '' }, h('div', { class: 't' }, h('span', { text: main }), sub && h('small', { text: sub })), side != null && h('b', { text: side }));

const seg = (key, opts) => { const cur = S.sub[key] || opts[0][0]; return h('div', { class: 'seg', role: 'tablist' }, opts.map(([k, l]) => h('button', { class: k === cur ? 'on' : '', role: 'tab', 'aria-selected': String(k === cur), text: l, onclick: () => { S.sub[key] = k; localStorage.setItem('vt-sub', JSON.stringify(S.sub)); render(); } }))); };

async function load(section, force) {
  if (!force && S.data[section] && Date.now() - S.at[section] < 30000) return;
  S.busy = true; renderHead();
  try {
    S.data[section] = await api('/api/m?s=' + section); S.at[section] = Date.now(); S.error = null; S.offline = null;
    try { localStorage.setItem('vt-cache:' + section, JSON.stringify({ at: S.at[section], data: S.data[section] })); } catch {}
  } catch (e) {
    const c = (() => { try { return JSON.parse(localStorage.getItem('vt-cache:' + section) || 'null'); } catch { return null; } })();
    if (c) { S.data[section] = c.data; S.at[section] = c.at; S.offline = c.at; S.error = null; }
    else S.error = e.message && !/fetch|network|load/i.test(e.message) ? e.message : 'No llego al PC. ¿Está ViperTeca abierta y Tailscale encendido?';

  catch (e) { toast(e.message); }

// ------------------------------------------------ TU SEMANA (1.26)
function weekCard() {
  const w = S.data.semana;
  if (!w) { if (!S.weekAsked) { S.weekAsked = true; api('/api/m?s=semana').then((d) => { S.data.semana = d; render(); }).catch(() => {}); } return null; }

      h('div', { class: 'stat' }, h('small', { text: 'Gastado' }), h('b', { text: sp.week ? money(Math.round(sp.week), sp.currency) : '—' })),
      h('div', { class: 'stat' }, h('small', { text: 'Este mes' }), h('b', { class: sp.limit && sp.month > sp.limit ? 'hot' : '', text: money(Math.round(sp.month), sp.currency) }))

    w.bdays.length ? h('div', {}, h('p', { class: 'wk-h', text: 'Cumpleaños cerca' }), list(w.bdays.map((b) => li(b.name + (b.kind === 'gato' ? ' 🐾' : ''), when(b.days), b.days <= 2 ? 'hot' : '', b.age ? 'cumple ' + b.age : null)))) : null,

    w.tramites.length ? h('div', {}, h('p', { class: 'wk-h', text: 'Trámites' }), list(w.tramites.map((t) => li(t.name, when(t.days), 'hot')))) : null

// ------------------------------------------------ RECIBO POR FOTO (1.26)
function shrinkPhoto(file) {

    const img = new Image();
    img.onload = () => { const k = Math.min(1, 1600 / img.width); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', 0.85)); };

}
function receiptCard(d) {

  if (tab === 'viendo') out.push(d.length ? card('Netflix y Crunchyroll', null, list(d.map((s) => li(s.name, s.left == null ? '' : s.left === 0 ? 'al día' : 'faltan ' + s.left, s.left ? '' : 'ok', [s.who === 'emily' ? 'Emily' : 'Vincenzo', s.platform === 'netflix' ? 'Netflix' : 'Crunchyroll', s.next ? 'nuevo ' + dd(s.next.at) : null].filter(Boolean).join(' · '))))) : h('p', { class: 'empty', text: 'Conecta Netflix o Crunchyroll en la app del PC (Viendo).' }));
  if (tab === 'anime') out.push(card('Lo que sigues', String(d.length), list(d.map((a) => li(a.title, a.next ? dd(a.next.at) : '', '', a.next ? 'episodio ' + a.next.episode + ' · ' + hm(a.next.at) : a.status === 'NOT_YET_RELEASED' ? 'por estrenarse' : 'sin episodios nuevos')))));
  if (tab === 'pc') {
    const s = d.sensors;
    out.push(d.current ? h('section', { class: 'hero' }, h('small', { text: 'Jugando ahora' }), h('h2', { text: d.current.title }), h('p', { text: 'desde las ' + hm(d.current.start) })) : null);
    out.push(s ? h('div', { class: 'strip' }, h('div', { class: 'stat' }, h('small', { text: 'CPU' }), h('b', { text: s.cpu?.temp != null ? Math.round(s.cpu.temp) + ' °C' : '—' }), h('small', { text: s.cpu?.load != null ? Math.round(s.cpu.load) + ' % de uso' : '' })), h('div', { class: 'stat' }, h('small', { text: 'GPU' }), h('b', { text: s.gpu?.temp != null ? Math.round(s.gpu.temp) + ' °C' : '—' }), h('small', { text: s.gpu?.load != null ? Math.round(s.gpu.load) + ' % de uso' : '' }))) : h('p', { class: 'empty', text: 'Sin sensores: abre LibreHardwareMonitor en el PC.' }));
    if (s?.fans?.length) out.push(card('Ventiladores', null, list(s.fans.map((f) => li(f.name, f.rpm + ' rpm')))));
    const pc = async (what, ok, ask) => { if (ask && !confirm(ask)) return; await act('pc', { do: what }, ok); setTimeout(() => load('pc', true), 1200); };
    const B = (icon, label, what, ok, cls, ask) => h('button', { class: 'pcbtn ' + (cls || ''), onclick: () => pc(what, ok, ask) }, h('span', { text: icon }), label);
    out.push(card('Música y volumen', null, h('div', { class: 'pcgrid' }, B('🔉', 'Bajar', 'vol-down', null), B('🔇', 'Silencio', 'mute', null), B('🔊', 'Subir', 'vol-up', null), B('⏮', 'Anterior', 'prev', null), B('⏯', 'Pausa', 'play-pause', null), B('⏭', 'Siguiente', 'next', null))));
    out.push(card('Avisos en este iPhone', S.pushOn ? 'activados' : null,
      SWOK
        ? h('button', { class: 'btn ' + (S.pushOn ? '' : 'primary'), text: S.pushOn ? 'Mandar uno de prueba' : 'Activar avisos', onclick: enablePush })
        : h('p', { class: 'hint', style: 'color:var(--muted);margin:0', text: 'Para recibir avisos, abre la app desde el enlace con candado (https) de «En el móvil» en el PC y añádela a la pantalla de inicio.' })));
    out.push(card('Modo enfoque', d.focus?.mode === 'on' ? 'activo' : d.focus?.mode === 'waiting' ? 'esperando un juego' : 'apagado', h('div', { class: 'pcgrid' }, B('🎯', d.focus?.mode === 'off' ? 'Activar' : 'Desactivar', 'focus', d.focus?.mode === 'off' ? 'Modo enfoque activado' : 'Modo enfoque desactivado', d.focus?.mode !== 'off' ? 'on' : ''))));
    out.push(card('El PC', d.shutdownAt && d.shutdownAt > Date.now() ? 'se apaga ' + until(d.shutdownAt) : null, h('div', { class: 'pcgrid' },
      B('🔒', 'Bloquear', 'lock', 'PC bloqueado'),
      B('🌙', 'Suspender', 'sleep', 'Suspendiendo el PC', '', '¿Suspender el PC? ViperTeca dejará de responder hasta que lo despiertes.'),
      d.shutdownAt && d.shutdownAt > Date.now() ? B('↩️', 'Cancelar apagado', 'cancel-shutdown', 'Apagado cancelado') : B('⏻', 'Apagar', 'shutdown', 'El PC se apaga en 1 minuto', 'danger', '¿Apagar el PC? Se apaga en 1 minuto y puedes cancelarlo desde aquí.')
    )));
  }
  return out;
}

// ------------------------------------------------ marco
const TITLES = { hoy: () => { const hr = new Date().getHours(); return hr < 12 ? 'Buenos días' : hr < 19 ? 'Buenas tardes' : 'Buenas noches'; }, casa: () => 'Casa', juegos: () => 'Juegos', genshin: () => 'Genshin', mas: () => 'Más' };
const main = $('#main');
function renderHead() { const b = $('.refresh'); if (b) b.classList.toggle('spin', S.busy); }
function render() {
  const t = S.tab;
  const keep = main.scrollTop;
  const d = t === 'mas' ? true : S.data[t];
  const head = h('header', { class: 'hd' }, h('div', {}, h('h1', { text: TITLES[t]() }), h('p', { text: t === 'hoy' ? new Date().toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^./, (c) => c.toUpperCase()) : S.at[t] ? 'Actualizado a las ' + hm(S.at[t]) : 'ViperTeca en tu PC' })), h('button', { class: 'refresh' + (S.busy ? ' spin' : ''), 'aria-label': 'Actualizar', onclick: () => load(t === 'mas' ? sub('mas', 'preguntar') : t, true) }, svg(ICONS.refresh)));
  const body = S.error && !S.data[t] ? [h('p', { class: 'err', text: S.error })] : !d ? [h('div', { class: 'skel' }), h('div', { class: 'skel' }), h('div', { class: 'skel' })] : t === 'hoy' ? hoy(d) : t === 'casa' ? casa(d) : t === 'juegos' ? juegos(d) : t === 'genshin' ? genshin(d) : mas();
  const off = S.offline && t !== 'mas' ? h('p', { class: 'off', text: 'Sin conexión con el PC · datos guardados ' + (new Date(S.offline).toDateString() === new Date().toDateString() ? 'a las ' + hm(S.offline) : 'del ' + dd(S.offline)) }) : null;
  main.replaceChildren(h('div', { class: 'view' }, head, off, S.error && S.data[t] ? h('p', { class: 'err', text: S.error }) : null, body));
  main.scrollTop = keep;
  $('#tabs').replaceChildren(...TABS.map(([k, l]) => h('button', { class: k === t ? 'on' : '', 'aria-current': k === t ? 'page' : null, onclick: () => { if (S.tab === k) { main.scrollTo({ top: 0, behavior: 'smooth' }); return; } S.tab = k; localStorage.setItem('vt-tab', k); main.scrollTop = 0; render(); if (k !== 'mas') load(k); } }, svg(ICONS[k]), h('span', { text: l }))));
}
// ---- avisos y uso sin conexión (necesitan HTTPS: el enlace de Tailscale con candado)
const SWOK = location.protocol === 'https:' && 'serviceWorker' in navigator;
if (SWOK) navigator.serviceWorker.register('/m/sw.js?t=' + encodeURIComponent(T), { scope: '/' }).catch(() => {});
const b64ToU8 = (s) => { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)); return Uint8Array.from(b, (c) => c.charCodeAt(0)); };
async function enablePush() {
  try {
    if (!SWOK || !('PushManager' in window)) return toast('Abre ViperTeca desde el icono de la pantalla de inicio (enlace con candado).');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Sin permiso para avisos: actívalo en Ajustes → Notificaciones → ViperTeca.');
    const reg = await navigator.serviceWorker.ready;
    const { key } = await api('/api/m/push/key');
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) }));
    const r = await api('/api/m/push/sub?test=1', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(sub) });
    toast(r.ok ? 'Avisos activados: te llegó uno de prueba.' : 'No se pudo activar.');
    S.pushOn = true; render();
  } catch (e) { toast('No se pudo activar: ' + (e.message || e)); }
}
if (SWOK && 'PushManager' in window) navigator.serviceWorker.ready.then((r) => r.pushManager.getSubscription()).then((s) => { S.pushOn = !!s; }).catch(() => {});
render();
if (S.tab !== 'mas') load(S.tab);
// se actualiza solo cada minuto mientras la tienes delante
setInterval(() => { if (document.visibilityState === 'visible' && S.tab !== 'mas') load(S.tab, true); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.tab !== 'mas') load(S.tab); });
</script>
