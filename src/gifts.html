<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis deseos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/regalos/icon.png?g=__G__">
<link rel="manifest" href="/regalos/manifest.webmanifest?g=__G__">
<title>Mis deseos</title>
<style>
:root{--bg:#fbf3ee;--card:#fff;--line:#ecdcd3;--text:#2b1d1f;--muted:#8a7175;--rose:#d9466f;--rose2:#f6d7df;--ok:#2f8f5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 40px)}
h1{margin:0;font:800 32px/1.05 -apple-system,system-ui,sans-serif;letter-spacing:-.02em}
.sub{margin:6px 0 18px;color:var(--muted)}
form{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 30px -18px rgba(120,40,60,.35)}
label{display:grid;gap:6px;font-size:14px;color:var(--muted);font-weight:600}
input,select{font:inherit;font-size:16px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:48px}
input:focus,select:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:transparent}
.row{display:flex;gap:8px}
.row input{flex:1}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.paste{background:var(--rose2);color:var(--rose);font-weight:700;border-radius:12px;padding:0 14px;min-height:48px}
.add{background:var(--rose);color:#fff;font-weight:700;font-size:17px;border-radius:14px;min-height:52px;transition:transform .12s ease-out}
.add:active,.paste:active{transform:scale(.97)}
.add[disabled]{opacity:.6}
.more{color:var(--muted);font-size:14px;text-align:left;background:none;padding:2px 0}
.extra{display:none;gap:10px}
.extra.on{display:grid}
h2{font-size:15px;color:var(--muted);margin:26px 4px 10px;font-weight:700}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.ph{width:76px;height:76px;border-radius:12px;background:var(--rose2) center/cover no-repeat;display:grid;place-items:center;color:var(--rose);font-weight:800;font-size:22px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.mt{color:var(--muted);font-size:13.5px;margin-top:2px}
.pr{color:var(--rose);font-weight:700}
.rm{color:var(--muted);background:none;padding:10px;font-size:20px;line-height:1}
.reading .mt::after{content:"";display:inline-block;width:10px;height:10px;margin-left:6px;border:2px solid var(--rose);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.reading .mt::after{animation:none}.add{transition:none}}
.empty{color:var(--muted);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:16px}
.tabs{display:flex;gap:6px;margin:0 0 16px;background:#f3e4dd;padding:4px;border-radius:14px}.tabs button{flex:1;min-height:40px;border-radius:10px;background:none;color:var(--muted);font-weight:700}.tabs button.on{background:#fff;color:var(--text);box-shadow:0 2px 8px -4px rgba(120,40,60,.4)}
.row2{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px}.row2 input{flex:1;min-width:0}
.cat{margin:18px 4px 6px;color:var(--muted);font-weight:700;font-size:14px}
.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px;font-size:16px;color:var(--text)}
.it i{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--rose)}.it.on i{background:var(--rose);box-shadow:inset 0 0 0 3px #fff}.it.on span{text-decoration:line-through;color:var(--muted)}.it small{margin-left:auto;color:var(--muted)}.it em{font-style:normal;font-size:12px;color:var(--rose)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,20px);opacity:0;background:var(--text);color:#fff;padding:12px 16px;border-radius:14px;font-size:15px;transition:opacity .2s,transform .2s;max-width:90vw;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head>
<body><main>
<div class="tabs" role="tablist"><button class="on" data-t="deseos" role="tab">Mis deseos</button><button data-t="compras" role="tab">Compras de la casa</button></div>
<section id="pDeseos">
<h1>Mis deseos</h1>
<p class="sub">Pega el enlace de lo que te gusta. La foto, el nombre y el precio se completan solos y Vincenzo lo ve al instante.</p>
<form id="f" autocomplete="off">
  <label>Enlace del producto
    <div class="row"><input id="link" type="url" inputmode="url" placeholder="https://…" enterkeyhint="done"><button type="button" class="paste" id="paste">Pegar</button></div>
  </label>
  <button type="button" class="more" id="moreBtn">+ Sin enlace, o con una nota</button>
  <div class="extra" id="extra">
    <label>Qué es (si no tienes enlace)<input id="name" maxlength="160" placeholder="Ej. perfume de vainilla"></label>
    <label>Nota (talla, color…)<input id="note" maxlength="300" placeholder="Opcional"></label>
    <label>Para<select id="for"></select></label>
  </div>
  <button class="add" id="add">Añadir a mi lista</button>
</form>
<h2>Lo que has añadido</h2>
<ul id="list"><li class="empty" style="display:block">Todavía nada.</li></ul>
</section>
<section id="pCompras" hidden>
<h1>Compras</h1>
<p class="sub">La lista de la casa, compartida con Vincenzo en vivo. Toca algo para marcarlo como comprado.</p>
<form id="fs" autocomplete="off" class="row2"><input id="sName" placeholder="Qué falta" enterkeyhint="done" maxlength="120"><input id="sQty" placeholder="Cant." maxlength="30" style="flex:0 0 80px"><button class="add" id="sAdd" style="min-height:48px;padding:0 16px">Añadir</button></form>
<div id="shop"></div>
</section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const G='__G__';
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3200)}
const api=(p,o)=>fetch(p+(p.includes('?')?'&':'?')+'g='+encodeURIComponent(G),o).then(async(r)=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'No se pudo');return j});
const money=(v,c)=>v==null?'':(c==='USD'?'$':c==='CRC'?'₡':c==='EUR'?'€':'')+Number(v).toLocaleString('es',{maximumFractionDigits:2})+(c&&!['USD','CRC','EUR'].includes(c)?' '+c:'');
let timer=null;
async function load(){
  let d;try{d=await api('/api/regalos')}catch(e){return toast(e.message)}
  const sel=$('#for');if(!sel.options.length){for(const p of d.people){const o=document.createElement('option');o.value=p;o.textContent=p==='Emi'?'Para mí':p;sel.append(o)}}
  const ul=$('#list');
  if(!d.items.length){ul.innerHTML='<li class="empty" style="display:block">Todavía nada.</li>'}
  else ul.innerHTML=d.items.map((g)=>'<li class="'+(g.reading?'reading':'')+'"><div class="ph">'+(g.image?'<img alt="" loading="lazy" referrerpolicy="no-referrer" src="'+esc(g.image)+'">':esc((g.name||'?').slice(0,1)))+'</div><div><div class="nm">'+esc(g.reading&&!g.ready?'Leyendo el enlace…':g.name)+'</div><div class="mt">'+[g.price!=null?'<span class="pr">'+esc(money(g.price,g.currency))+'</span>':'',esc(g.store||''),g.for!=='Emi'?'para '+esc(g.for):''].filter(Boolean).join(' · ')+'</div></div><button class="rm" data-id="'+esc(g.id)+'" aria-label="Quitar">×</button></li>').join('');
  clearTimeout(timer);
  if(d.items.some((g)=>g.reading))timer=setTimeout(load,2000);
}
$('#list').addEventListener('click',async(e)=>{const b=e.target.closest('.rm');if(!b)return;if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='¿Quitar?';b.style.fontSize='14px';setTimeout(()=>{b.dataset.sure='';b.textContent='×';b.style.fontSize=''},3000);return}
  try{await api('/api/regalos/remove?id='+encodeURIComponent(b.dataset.id),{method:'POST'});load()}catch(x){toast(x.message)}});
$('#moreBtn').onclick=()=>{$('#extra').classList.toggle('on')};
$('#paste').onclick=async()=>{try{const t=await navigator.clipboard.readText();const m=String(t).match(/https?:\/\/\S+/);if(m){$('#link').value=m[0];toast('Enlace pegado')}else toast('No hay un enlace copiado')}catch{ $('#link').focus();toast('Mantén pulsado el campo y elige Pegar')}};
if(!navigator.clipboard||!navigator.clipboard.readText)$('#paste').style.display='none';
$('#f').addEventListener('submit',async(e)=>{e.preventDefault();
  const raw=$('#link').value.trim();const link=(raw.match(/https?:\/\/\S+/)||[''])[0];const name=$('#name').value.trim();
  if(!link&&!name){toast('Pega un enlace o escribe qué es');return}
  const b=$('#add');b.disabled=true;b.textContent='Añadiendo…';
  try{await api('/api/regalos/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link,name,note:$('#note').value.trim(),for:$('#for').value||'Emi'})});
    $('#link').value='';$('#name').value='';$('#note').value='';toast('¡Añadido! Vincenzo ya lo ve');load()}
  catch(x){toast(x.message)}
  b.disabled=false;b.textContent='Añadir a mi lista'});
// enlace compartido desde otra app (Android) o abierto con ?url=
const q=new URLSearchParams(location.search);const shared=q.get('url')||((q.get('text')||'').match(/https?:\/\/\S+/)||[''])[0];if(shared)$('#link').value=shared;
// ---- compras de la casa (en vivo: se actualiza cada 4 s mientras está abierta)
let tab=localStorage.getItem('emi-tab')||'deseos',shopT=null;
function setTab(t){tab=t;localStorage.setItem('emi-tab',t);document.querySelectorAll('.tabs button').forEach((b)=>b.classList.toggle('on',b.dataset.t===t));$('#pDeseos').hidden=t!=='deseos';$('#pCompras').hidden=t!=='compras';if(t==='compras')shop();else load()}
document.querySelectorAll('.tabs button').forEach((b)=>b.onclick=()=>setTab(b.dataset.t));
async function shop(){clearTimeout(shopT);let d;try{d=await api('/api/regalos/compras')}catch(e){return toast(e.message)}
  const pend=d.items.filter((x)=>!x.done),done=d.items.filter((x)=>x.done);const cats=[...new Set([...d.cats,...pend.map((x)=>x.cat)])];
  const row=(x)=>'<button class="it'+(x.done?' on':'')+'" data-id="'+esc(x.id)+'"><i></i><span>'+esc(x.name)+'</span>'+(x.by==='Emi'?' <em>tuyo</em>':'')+(x.qty?'<small>'+esc(x.qty)+'</small>':'')+'</button>';
  let html='';for(const c of cats){const l=pend.filter((x)=>x.cat===c);if(l.length)html+='<p class="cat">'+esc(c)+'</p>'+l.map(row).join('')}
  if(!pend.length)html+='<p class="empty">No falta nada.</p>';if(done.length)html+='<p class="cat">Comprado hace poco</p>'+done.map(row).join('');
  $('#shop').innerHTML=html;if(tab==='compras'&&!document.hidden)shopT=setTimeout(shop,4000)}
$('#shop').addEventListener('click',async(e)=>{const b=e.target.closest('.it');if(!b)return;b.classList.toggle('on');try{await api('/api/regalos/compras/toggle?id='+encodeURIComponent(b.dataset.id),{method:'POST'})}catch(x){toast(x.message)}shop()});
$('#fs').addEventListener('submit',async(e)=>{e.preventDefault();const n=$('#sName').value.trim();if(!n)return;try{await api('/api/regalos/compras/add?name='+encodeURIComponent(n)+'&qty='+encodeURIComponent($('#sQty').value.trim()),{method:'POST'});$('#sName').value='';$('#sQty').value='';toast('Añadido a la lista');shop()}catch(x){toast(x.message)}});
setTab(shared?'deseos':tab);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)(tab==='compras'?shop():load())});
</script>
</body></html>
