<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Diario de partidas</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1a1214;color:#f8eef0;font:14px/1.45 "Segoe UI Variable","Segoe UI",sans-serif;-webkit-app-region:drag}
main{display:grid;gap:10px;padding:16px 18px;height:100%;grid-template-rows:auto 1fr auto;border:1px solid #3b2b30;border-radius:12px}
h1{margin:0;font:700 16px Bahnschrift,"Segoe UI",sans-serif}
small{color:#b8a3a8;font-weight:400}
textarea{-webkit-app-region:no-drag;width:100%;resize:none;border:1px solid #3b2b30;border-radius:10px;background:#211719;color:inherit;font:inherit;padding:10px}
textarea:focus{outline:2px solid #ff5d73;outline-offset:1px;border-color:transparent}
.row{display:flex;gap:8px;justify-content:flex-end;-webkit-app-region:no-drag}
button{font:600 13px "Segoe UI",sans-serif;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;transition:transform .12s ease-out}
button:active{transform:scale(.97)}
.go{background:#e5334f;color:#fff}.skip{background:transparent;color:#b8a3a8}
</style></head>
<body><main>
<h1 id="t">¿Dónde lo dejaste?</h1>
<textarea id="n" placeholder="Ej.: voy por el jefe del castillo, me falta la llave azul. Mejorar la espada antes." maxlength="1000" autofocus></textarea>
<div class="row"><button class="skip" id="skip">Ahora no</button><button class="go" id="save">Guardar</button></div>
</main>
<script>
const q = new URLSearchParams(location.search);
const id = q.get('id'), title = q.get('title') || 'el juego', min = Number(q.get('min')) || 0;
document.getElementById('t').innerHTML = '';
const t = document.getElementById('t');
t.append('¿Dónde lo dejaste en ' + title + '? ');
const s = document.createElement('small'); s.textContent = min >= 60 ? Math.floor(min / 60) + ' h ' + (min % 60) + ' min' : min + ' min'; t.append(s);
const save = () => window.api.journal.save(id, document.getElementById('n').value, min);
document.getElementById('save').onclick = save;
document.getElementById('skip').onclick = () => window.api.journal.close();
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.api.journal.close(); if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) save(); });
</script>
</body></html>
